train_dataloader:
  shuffle: True
  total_batch_size: 32
  num_workers: 4
  dataset:
    # Stronger augmentation for harder/low-score classes (applied only when label matches).
    hard_classes: [NSFW_EXPLICIT]
    hard_transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.9}
        - {type: RandomRotation, degrees: 15}
        - {type: RandomPerspective, distortion_scale: 0.3, p: 0.3}
        - {type: RandomHorizontalFlip}
        - {type: RandomResizedCrop, size: [384, 384], scale: [0.7, 1.0]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [384, 384]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      # Override base detection policy; using default forward scheduler.
      policy: ~
  collate_fn:
    type: ClassificationCollateFunction

val_dataloader:
  shuffle: False
  total_batch_size: 64
  num_workers: 4
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [384, 384]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  collate_fn:
    type: ClassificationCollateFunction

