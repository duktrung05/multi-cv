task: classification
task_domain: dgm4_binary
class_list: [REAL, AI_EDITED]
num_classes: 2
backbone: dinov3_vits16
feature_pooling: cls_and_mean_patch
freeze_backbone: true
pretrained: ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
dataset_root: data/dgm4_binary
audit_report: outputs/dgm4_binary/audit/audit.json
image_size: 384
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
device: auto
num_threads: 2
# Frozen features are extracted once, in small batches for a 6 GB GPU.
extract_batch_size: 4
head_batch_size: 128
num_workers: 0
epochs: 30
lr: 0.001
weight_decay: 0.0001
early_stopping_patience: 5
seed: 42
threshold: 0.5
output_dir: outputs/dgm4_binary/baseline
cache_dir: outputs/dgm4_binary/features
limit_per_class: null
test_only: false
eval_split: val
resume: null
