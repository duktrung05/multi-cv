name: reas-iasvas-add-multilabel-classification

services:
  api:
    image: reas-iasvas-add-multilabel-classification:local
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8126"
      MODEL_DEVICE: cpu
      CLASSIFICATION_CONFIG: /app/configs/dgm4_binary.yml
      CLASSIFICATION_CKPT: /app/ckpts/dgm4_binary.pth
      WORK_DIR: /app/outputs/jobs
      TMP_DIR: /app/outputs/tmp
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8126}:8126"
    volumes:
      - ./ckpts:/app/ckpts:ro
      - ./configs:/app/configs:ro
      - classification_outputs:/app/outputs
    init: true
    restart: "no"

volumes:
  classification_outputs:
